name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build docs
        run: |
          npm ci
          # Build the library so docs demo can import it
          npm run build
          # Copy built files into docs for the live demo
          mkdir -p docs/dist
          cp dist/style.css docs/dist/
          cp dist/wandertable.js docs/dist/
          cp dist/wandertable.js.map docs/dist/
          # Rewrite the import paths in docs/index.html for production
          sed -i "s|import '../src/styles.css';|import './dist/style.css';|g" docs/index.html
          sed -i "s|import { WanderTable } from '../src/index.ts';|import { WanderTable } from './dist/wandertable.js';|g" docs/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
